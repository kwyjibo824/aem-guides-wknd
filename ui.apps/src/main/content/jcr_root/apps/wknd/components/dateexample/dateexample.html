<div class="cmp-dateexample" data-cmp-is="dateexample">
    <h2 class="cmp-dateexample__title">Date Example Component</h2>
    <div class="cmp-dateexample__item" data-sly-test="${properties.eventDate}">
        <p class="cmp-dateexample__item-label">Event Date:</p>
        <pre class="cmp-dateexample__item-output">${properties.eventDate @ format='yyyy-MM-dd'}</pre>
    </div>
    <div class="cmp-dateexample__item" data-sly-test="${properties.eventDateTime}">
        <p class="cmp-dateexample__item-label">Event Date &amp; Time:</p>
        <pre class="cmp-dateexample__item-output">${properties.eventDateTime @ format='yyyy-MM-dd HH:mm'}</pre>
    </div>
</div>
